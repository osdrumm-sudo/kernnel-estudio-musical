name: Metriqa | Validación continua (sin despliegue)

on:
  push:
    branches:
      - main
      - 'mantenimiento/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Sintaxis, acceso, sincronización y respaldos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Ejecutar pruebas con datos ficticios
        run: node --test tests/*.test.cjs
