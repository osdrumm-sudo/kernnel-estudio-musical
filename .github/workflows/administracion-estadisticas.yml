name: Kernnel | Panel de estadísticas (pruebas, sin desplegar)
on:
  push:
    branches:
      - feature/panel-administracion-estadisticas
  pull_request:
    paths:
      - admin/**
      - .github/workflows/administracion-estadisticas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar sintaxis y restricciones
        working-directory: admin
        run: npm run check
      - name: Ejecutar pruebas sin datos reales
        working-directory: admin
        run: npm test
